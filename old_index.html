<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANA — Assistente Normativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: "class" };</script>
    <style>
      .pretty-scroll::-webkit-scrollbar { width: 8px; }
      .pretty-scroll::-webkit-scrollbar-track { background: transparent; }
      .pretty-scroll::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.3); border-radius: 999px; }
      .pretty-scroll::-webkit-scrollbar-thumb:hover { background: rgba(120,120,120,0.5); }
      .fade-in { animation: fadeIn .15s ease-out; }
      @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
      .dot-1, .dot-2, .dot-3 { display:inline-block; animation:dot 1.4s infinite; }
      .dot-2 { animation-delay:.25s; }
      .dot-3 { animation-delay:.5s; }
      @keyframes dot { 0%,80%,100% { opacity:.15; } 40% { opacity:1; } }
      details > summary { list-style: none; }
      details > summary::-webkit-details-marker { display: none; }
      details[open] > summary .arrow { transform: rotate(90deg); }
    </style>
  </head>

  <body class="h-full bg-white text-slate-900 dark:bg-zinc-950 dark:text-zinc-100">
  <div class="h-full flex relative">

    <!-- Mobile sidebar overlay -->
    <div id="sidebarOverlay"
      class="hidden fixed inset-0 bg-black/40 z-30 md:hidden"></div>

    <!-- ======================================================
         Transcription Drawer
    ====================================================== -->
    <div id="transDrawer"
      class="fixed inset-y-0 right-0 w-full sm:w-[440px] bg-white dark:bg-zinc-900 border-l border-slate-200 dark:border-zinc-800 shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col">

      <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-zinc-800 shrink-0">
        <h2 class="font-semibold text-sm">Transcrição de Audiência</h2>
        <button id="closeDrawerBtn"
          class="text-slate-400 hover:text-slate-700 dark:hover:text-zinc-100 text-lg leading-none px-2 py-0.5 rounded hover:bg-slate-100 dark:hover:bg-zinc-800">✕</button>
      </div>

      <div class="flex-1 overflow-y-auto pretty-scroll p-4 space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1.5 text-slate-600 dark:text-zinc-400">Arquivo de áudio ou vídeo</label>
          <input type="file" id="audioFile" accept="audio/*,video/*"
            class="block w-full text-sm text-slate-500 dark:text-zinc-400
                   file:mr-3 file:py-1.5 file:px-3 file:rounded-lg
                   file:border file:border-slate-200 dark:file:border-zinc-700
                   file:text-xs file:font-medium
                   file:bg-slate-50 dark:file:bg-zinc-800
                   hover:file:bg-slate-100 dark:hover:file:bg-zinc-700
                   file:transition-colors cursor-pointer">
        </div>

        <details class="group border border-slate-200 dark:border-zinc-800 rounded-xl overflow-hidden">
          <summary class="flex items-center gap-2 px-3 py-2.5 text-xs font-medium text-slate-500 dark:text-zinc-400 cursor-pointer select-none hover:bg-slate-50 dark:hover:bg-zinc-800/50">
            <span class="arrow inline-block transition-transform text-[10px] opacity-60">▶</span>
            Metadados da audiência (opcional)
          </summary>
          <div class="px-3 pb-3 pt-2 space-y-2 border-t border-slate-200 dark:border-zinc-800">
            <input id="metaProcesso" type="text" placeholder="Número do processo CNJ — 0001234-56.2024.8.26.0100"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaData" type="text" placeholder="Data da audiência — 15/01/2025"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaTipo" type="text" value="Instrução e Julgamento" placeholder="Tipo da audiência"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaVara" type="text" placeholder="Vara / Tribunal — 3ª Vara Cível, Foro Central"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaCidade" type="text" placeholder="Cidade / UF — São Paulo/SP"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <!-- Participantes esperados -->
            <p class="text-xs text-slate-500 dark:text-zinc-400 pt-1">Participantes (opcional — melhora identificação)</p>
            <input id="metaJuiz" type="text" placeholder="Nome do(a) juiz(a)"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaAdvAutor" type="text" placeholder="Advogado(a) do autor"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaAdvReu" type="text" placeholder="Advogado(a) do réu"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaTestemunha1" type="text" placeholder="Testemunha 1"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaTestemunha2" type="text" placeholder="Testemunha 2"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <input id="metaPerito" type="text" placeholder="Perito(a)"
              class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500 placeholder:text-slate-400 dark:placeholder:text-zinc-600">
            <div class="flex gap-3">
              <div class="flex-1">
                <label class="block text-xs text-slate-500 dark:text-zinc-500 mb-1">Mín. falantes</label>
                <input id="metaMinSpk" type="number" min="1" max="4" value="2"
                  class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none">
              </div>
              <div class="flex-1">
                <label class="block text-xs text-slate-500 dark:text-zinc-500 mb-1">Máx. falantes</label>
                <input id="metaMaxSpk" type="number" min="2" max="10" value="6"
                  class="w-full text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none">
              </div>
            </div>
          </div>
        </details>

        <button id="transcreverBtn"
          class="w-full rounded-xl py-2.5 text-sm font-medium bg-slate-900 dark:bg-zinc-100 text-white dark:text-zinc-900 hover:bg-slate-700 dark:hover:bg-zinc-200 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          Iniciar Transcrição
        </button>

        <div id="transStatus" class="hidden text-xs text-slate-500 dark:text-zinc-400 text-center py-2"></div>

        <div id="transResult"
          class="hidden pretty-scroll max-h-[50vh] overflow-y-auto rounded-xl border border-slate-200 dark:border-zinc-800 p-3 text-xs leading-relaxed">
        </div>

        <div id="transCorrections" class="hidden space-y-2">
          <p class="text-xs font-medium text-slate-600 dark:text-zinc-400">Revisão de participantes (Camada 4)</p>
          <div id="correctionsList" class="space-y-1.5"></div>
          <button id="applyCorrectionsBtn"
            class="w-full rounded-xl py-2 text-xs font-medium border border-slate-300 dark:border-zinc-700 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors">
            Aplicar correções
          </button>
        </div>
      </div>
    </div>

    <!-- ======================================================
         Sidebar
    ====================================================== -->
    <aside id="sidebar"
      class="w-[260px] hidden md:flex flex-col border-r border-slate-200 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900/40 shrink-0">

      <div class="p-3 flex items-center gap-2">
        <button id="newChatBtn"
          class="flex-1 inline-flex items-center justify-center gap-1.5 rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
          + Nova consulta
        </button>
        <!-- Only visible when sidebar is open as overlay on mobile -->
        <button id="sidebarCloseBtn"
          class="md:hidden text-slate-400 hover:text-slate-700 dark:hover:text-zinc-100 text-base px-2 py-1.5 rounded hover:bg-slate-100 dark:hover:bg-zinc-800">
          ✕
        </button>
      </div>

      <div class="px-3 pb-2 flex items-center justify-between">
        <span class="text-xs uppercase tracking-wider text-slate-400 dark:text-zinc-500">Histórico</span>
        <button id="toggleThemeBtn"
          class="text-xs rounded-md px-2 py-1 border border-slate-200 dark:border-zinc-800 hover:bg-white dark:hover:bg-zinc-800 transition-colors">
          Tema
        </button>
      </div>

      <nav id="chatList" class="pretty-scroll flex-1 overflow-y-auto px-2 pb-2 space-y-0.5"></nav>

      <div class="p-3 border-t border-slate-200 dark:border-zinc-800">
        <button id="openTransBtn"
          class="w-full inline-flex items-center gap-2 rounded-lg border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-3 py-2 text-sm text-slate-600 dark:text-zinc-400 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
          Transcrição de audiência
        </button>
      </div>
    </aside>

    <!-- ======================================================
         Main
    ====================================================== -->
    <main class="flex-1 flex flex-col min-w-0">

      <!-- Mobile header -->
      <header class="md:hidden flex items-center justify-between px-3 py-3 border-b border-slate-200 dark:border-zinc-800 shrink-0">
        <button id="hamburgerBtn"
          class="text-sm rounded-lg px-2.5 py-1.5 border border-slate-200 dark:border-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-800 transition-colors">
          ☰
        </button>
        <span class="font-semibold text-sm">ANA</span>
        <div class="flex items-center gap-1.5">
          <button id="openTransBtnMobile" class="text-xs rounded-md px-2 py-1 border border-slate-200 dark:border-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-800">Trans.</button>
          <button id="toggleThemeBtnMobile" class="text-xs rounded-md px-2 py-1 border border-slate-200 dark:border-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-800">Tema</button>
          <button id="newChatBtnMobile" class="text-xs rounded-md px-2 py-1 border border-slate-200 dark:border-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-800">+</button>
        </div>
      </header>

      <!-- Messages -->
      <section id="messages" class="pretty-scroll flex-1 overflow-y-auto bg-white dark:bg-zinc-950">
        <div id="messageInner" class="mx-auto w-full max-w-5xl px-4 md:px-6 py-6 space-y-5"></div>
      </section>

      <!-- Composer -->
      <footer class="border-t border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 shrink-0">
        <div class="mx-auto w-full max-w-4xl px-4 md:px-6 py-4">
          <div id="composerShell" class="transition-all duration-200">

            <!-- Empty state header + suggestions -->
            <div id="composerHeader" class="mb-3 text-center">
              <div class="text-base md:text-lg font-semibold tracking-tight">
                Qual lei você quer pesquisar?
              </div>
              <div class="mt-3 flex flex-wrap items-center justify-center gap-2">
                <button class="suggestBtn rounded-full border border-slate-200 dark:border-zinc-800 px-3 py-1.5 text-xs md:text-sm hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors"
                  data-text="Prazo para contestação no processo civil">Processo civil</button>
                <button class="suggestBtn rounded-full border border-slate-200 dark:border-zinc-800 px-3 py-1.5 text-xs md:text-sm hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors"
                  data-text="Consentimento para tratamento de dados pessoais LGPD">LGPD</button>
                <button class="suggestBtn rounded-full border border-slate-200 dark:border-zinc-800 px-3 py-1.5 text-xs md:text-sm hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors"
                  data-text="Rescisão de contrato de trabalho sem justa causa">Trabalhista</button>
                <button class="suggestBtn rounded-full border border-slate-200 dark:border-zinc-800 px-3 py-1.5 text-xs md:text-sm hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors"
                  data-text="Direitos do consumidor vício do produto CDC">Consumidor</button>
              </div>
            </div>

            <!-- Composer card -->
            <div class="rounded-2xl border border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/40 shadow-sm">

              <!-- Toolbar -->
              <div class="flex items-center justify-between px-3 pt-2.5">
                <div class="flex items-center gap-1.5">

                  <!-- Vigência toggle -->
                  <button id="vigenciaBtn" data-active="true"
                    class="rounded-lg px-2.5 py-1 text-xs border transition-colors duration-150 font-medium
                           border-emerald-400 text-emerald-600 bg-emerald-50
                           dark:border-emerald-500 dark:text-emerald-400 dark:bg-emerald-950/40"
                    title="Clique para alternar entre leis vigentes / todas as leis">
                    Vigentes
                  </button>

                  <!-- Top-k counter -->
                  <div class="flex items-center rounded-lg border border-slate-200 dark:border-zinc-800 overflow-hidden" title="Número de resultados">
                    <button id="kMinusBtn"
                      class="px-2 py-1 text-xs text-slate-400 hover:text-slate-700 dark:hover:text-zinc-100 hover:bg-slate-50 dark:hover:bg-zinc-800/60 transition-colors border-r border-slate-200 dark:border-zinc-800">−</button>
                    <span id="kValue" class="px-2 py-1 text-xs tabular-nums select-none text-slate-600 dark:text-zinc-300 min-w-[1.75rem] text-center">5</span>
                    <button id="kPlusBtn"
                      class="px-2 py-1 text-xs text-slate-400 hover:text-slate-700 dark:hover:text-zinc-100 hover:bg-slate-50 dark:hover:bg-zinc-800/60 transition-colors border-l border-slate-200 dark:border-zinc-800">+</button>
                  </div>

                  <!-- Clear input -->
                  <button id="clearBtn"
                    class="rounded-lg px-2 py-1 text-xs border border-slate-200 dark:border-zinc-800 hover:bg-slate-50 dark:hover:bg-zinc-800/60 transition-colors text-slate-500 dark:text-zinc-400"
                    title="Limpar">Limpar</button>

                </div>

                <div class="flex items-center gap-2">
                  <span id="charCount" class="text-[11px] text-slate-400 dark:text-zinc-500 tabular-nums">0</span>
                  <button id="stopBtn"
                    class="hidden rounded-lg px-2 py-1 text-xs border border-slate-200 dark:border-zinc-800 text-slate-500 dark:text-zinc-400"
                    title="Cancelar busca">Parar</button>
                </div>
              </div>

              <!-- Textarea + send -->
              <div class="flex items-end gap-2 p-3 pt-2">
                <textarea id="composer" rows="1"
                  class="pretty-scroll flex-1 resize-none bg-transparent outline-none text-sm leading-6 max-h-44 px-2 py-2 placeholder:text-slate-400 dark:placeholder:text-zinc-600"
                  placeholder="Ex: prazo para contestação no processo civil..."></textarea>
                <button id="sendBtn"
                  class="shrink-0 rounded-xl px-4 py-2 text-sm font-medium bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-zinc-100 dark:text-zinc-900 dark:hover:bg-zinc-200 transition-colors">
                  Enviar
                </button>
              </div>
            </div>

            <p class="mt-2 text-center text-xs text-slate-400 dark:text-zinc-500">
              ANA — dados processados localmente (LGPD)
            </p>
          </div>
        </div>
      </footer>
    </main>

  </div><!-- end h-full flex -->

  <script>
    // ===========================================================
    // Config
    // ===========================================================
    const BACKEND_URL = window.ANA_BACKEND_URL || "http://localhost:8000";
    const STORAGE_KEY = "ana_chat_v1";
    const THEME_KEY   = "ana_theme_v1";
    const PREVIEW     = 320;   // chars shown before "Ver artigo completo"

    let vigenciaAtiva = true;
    let topK = 5;
    let isBusy = false;
    let abortCtrl = null;
    let msgCounter = 0;
    const fullTextMap = {};     // key → full article text (session memory)
    const summaryMap = {};      // summaryId → accumulated streaming text

    // ===========================================================
    // DOM refs
    // ===========================================================
    const $ = (s) => document.querySelector(s);
    const els = {
      chatList:             $("#chatList"),
      messageInner:         $("#messageInner"),
      messagesWrap:         $("#messages"),
      composer:             $("#composer"),
      sendBtn:              $("#sendBtn"),
      newChatBtn:           $("#newChatBtn"),
      newChatBtnMobile:     $("#newChatBtnMobile"),
      toggleThemeBtn:       $("#toggleThemeBtn"),
      toggleThemeBtnMobile: $("#toggleThemeBtnMobile"),
      composerShell:        $("#composerShell"),
      composerHeader:       $("#composerHeader"),
      clearBtn:             $("#clearBtn"),
      stopBtn:              $("#stopBtn"),
      charCount:            $("#charCount"),
      vigenciaBtn:          $("#vigenciaBtn"),
      kMinusBtn:            $("#kMinusBtn"),
      kPlusBtn:             $("#kPlusBtn"),
      kValue:               $("#kValue"),
      openTransBtn:         $("#openTransBtn"),
      openTransBtnMobile:   $("#openTransBtnMobile"),
      closeDrawerBtn:       $("#closeDrawerBtn"),
      transDrawer:          $("#transDrawer"),
      transcreverBtn:       $("#transcreverBtn"),
      transStatus:          $("#transStatus"),
      transResult:          $("#transResult"),
      transCorrections:     $("#transCorrections"),
      correctionsList:      $("#correctionsList"),
      applyCorrectionsBtn:  $("#applyCorrectionsBtn"),
      audioFile:            $("#audioFile"),
      sidebar:              $("#sidebar"),
      sidebarOverlay:       $("#sidebarOverlay"),
      sidebarCloseBtn:      $("#sidebarCloseBtn"),
      hamburgerBtn:         $("#hamburgerBtn"),
    };

    // ===========================================================
    // Theme
    // ===========================================================
    const loadTheme  = () => localStorage.getItem(THEME_KEY) || "dark";
    const saveTheme  = (t) => localStorage.setItem(THEME_KEY, t);
    const applyTheme = (t) => document.documentElement.classList.toggle("dark", t === "dark");
    const toggleTheme = () => {
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      applyTheme(next); saveTheme(next);
    };

    // ===========================================================
    // Mobile sidebar (overlay)
    // ===========================================================
    function openSidebar() {
      els.sidebar.classList.remove("hidden");
      els.sidebar.classList.add("flex", "fixed", "inset-y-0", "left-0", "z-40", "shadow-2xl");
      els.sidebarOverlay.classList.remove("hidden");
    }
    function closeSidebar() {
      if (window.innerWidth >= 768) return;   // CSS handles desktop
      els.sidebar.classList.add("hidden");
      els.sidebar.classList.remove("flex", "fixed", "inset-y-0", "left-0", "z-40", "shadow-2xl");
      els.sidebarOverlay.classList.add("hidden");
    }
    els.hamburgerBtn?.addEventListener("click", openSidebar);
    els.sidebarOverlay?.addEventListener("click", closeSidebar);
    els.sidebarCloseBtn?.addEventListener("click", closeSidebar);

    // ===========================================================
    // Storage / chats
    // ===========================================================
    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { chats: [], activeChatId: "" };
        const p = JSON.parse(raw);
        return { chats: p.chats || [], activeChatId: p.activeChatId || "" };
      } catch { return { chats: [], activeChatId: "" }; }
    };
    const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const uid = () => Math.random().toString(16).slice(2) + Date.now().toString(16);
    const createChat = () => ({ id: uid(), title: "Nova consulta", createdAt: Date.now(), messages: [] });
    const getActiveChat = () => state.chats.find(c => c.id === state.activeChatId);

    let state = loadState();
    if (!state.activeChatId || !state.chats.find(c => c.id === state.activeChatId)) {
      const c = createChat();
      state.chats.unshift(c);
      state.activeChatId = c.id;
      saveState();
    }

    applyTheme(loadTheme());
    renderAll();

    // ===========================================================
    // Rendering
    // ===========================================================
    function renderAll() {
      renderChatList();
      renderMessages();
      updateSendBtn();
      autosizeTextarea();
      updateComposerLayout();
      updateCharCount();
    }

    function renderChatList() {
      els.chatList.innerHTML = "";
      [...state.chats]
        .sort((a, b) => b.createdAt - a.createdAt)
        .forEach(chat => {
          const btn = document.createElement("button");
          const active = chat.id === state.activeChatId;
          btn.className =
            "w-full text-left px-3 py-2 rounded-lg text-sm border " +
            (active
              ? "bg-white dark:bg-zinc-900 border-slate-200 dark:border-zinc-800"
              : "bg-transparent border-transparent hover:bg-white/70 dark:hover:bg-zinc-800/50");
          btn.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <div class="truncate text-xs">${escHtml(chat.title)}</div>
              <button class="deleteChatBtn shrink-0 text-xs px-1.5 py-0.5 rounded opacity-50 hover:opacity-100 hover:bg-slate-100 dark:hover:bg-zinc-800"
                title="Apagar" data-id="${chat.id}">✕</button>
            </div>`;
          btn.addEventListener("click", (e) => {
            if (e.target.classList.contains("deleteChatBtn")) return;
            state.activeChatId = chat.id; saveState(); renderAll(); scrollToBottom();
            closeSidebar();
          });
          btn.querySelector(".deleteChatBtn").addEventListener("click", (e) => {
            e.stopPropagation(); deleteChat(chat.id);
          });
          els.chatList.appendChild(btn);
        });
    }

    function renderMessages() {
      const chat = getActiveChat();
      els.messageInner.innerHTML = "";
      if (!chat || chat.messages.length === 0) return;
      chat.messages.forEach(m => els.messageInner.appendChild(buildBubble(m.role, m.content)));
    }

    function buildBubble(role, content) {
      const row = document.createElement("div");
      row.className = "w-full fade-in";

      const bubble = document.createElement("div");

      if (role === "user") {
        bubble.className =
          "max-w-[85%] md:max-w-[70%] rounded-2xl px-4 py-3 text-sm leading-6 ml-auto " +
          "bg-slate-900 text-white dark:bg-zinc-100 dark:text-zinc-900";
        bubble.innerText = content;

      } else if (content === "__thinking__") {
        bubble.className =
          "w-full rounded-2xl px-4 py-3 text-sm leading-6 " +
          "bg-slate-50 dark:bg-zinc-900/60 border border-slate-200 dark:border-zinc-800";
        bubble.innerHTML = `
          <div class="flex items-center gap-1.5 text-slate-400 dark:text-zinc-500 py-0.5 select-none">
            <span class="text-sm">Buscando</span>
            <span class="dot-1 text-lg font-bold leading-none">.</span>
            <span class="dot-2 text-lg font-bold leading-none">.</span>
            <span class="dot-3 text-lg font-bold leading-none">.</span>
          </div>`;

      } else if (content === "__thinking_summary__") {
        // Summary loading state
        bubble.className =
          "w-full rounded-2xl px-4 py-3 text-sm leading-6 " +
          "bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-800";
        bubble.innerHTML = `
          <div class="flex items-center gap-1.5 text-indigo-400 dark:text-indigo-500 py-0.5 select-none">
            <span class="text-sm">Analisando artigos</span>
            <span class="dot-1 text-lg font-bold leading-none">.</span>
            <span class="dot-2 text-lg font-bold leading-none">.</span>
            <span class="dot-3 text-lg font-bold leading-none">.</span>
          </div>`;

      } else if (content.startsWith("__ANALISE__")) {
        // Completed summary — indigo styling with label
        bubble.className =
          "w-full rounded-2xl px-4 py-3 text-sm leading-6 " +
          "bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-800";
        const text = content.slice(11);  // strip "__ANALISE__"
        bubble.innerHTML =
          `<p class="text-xs font-semibold text-indigo-500 dark:text-indigo-400 mb-2 uppercase tracking-wide">Análise dos artigos encontrados</p>` +
          renderMd(text);

      } else {
        bubble.className =
          "w-full rounded-2xl px-4 py-3 text-sm leading-6 " +
          "bg-slate-50 dark:bg-zinc-900/60 border border-slate-200 dark:border-zinc-800";
        bubble.innerHTML = renderMd(content);
      }

      row.appendChild(bubble);
      return row;
    }

    function scrollToBottom(smooth = true) {
      els.messagesWrap.scrollTo({ top: els.messagesWrap.scrollHeight, behavior: smooth ? "smooth" : "instant" });
    }

    function updateSendBtn() {
      els.sendBtn.disabled = els.composer.value.trim().length === 0 || isBusy;
    }

    function updateCharCount() {
      els.charCount.textContent = String(els.composer.value.length);
    }

    function updateComposerLayout() {
      const chat = getActiveChat();
      const empty = !chat || chat.messages.length === 0;
      if (empty) {
        els.messagesWrap.classList.add("hidden");
        els.composerHeader.classList.remove("hidden");
        els.composerShell.classList.add("py-8");
        els.composerShell.parentElement.parentElement.classList.add("flex-1", "flex", "items-center");
      } else {
        els.messagesWrap.classList.remove("hidden");
        els.composerHeader.classList.add("hidden");
        els.composerShell.classList.remove("py-8");
        els.composerShell.parentElement.parentElement.classList.remove("flex-1", "flex", "items-center");
      }
    }

    // ===========================================================
    // Markdown renderer
    // ===========================================================
    function renderMd(md) {
      const esc = (s) => (s || "").replace(/[&<>"']/g,
        m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]);

      const inlineFormat = (s) => s
        .replace(/&amp;nbsp;/g, "&nbsp;")
        .replace(/`([^`]+)`/g, '<code class="bg-zinc-200 dark:bg-zinc-700 px-1 rounded text-xs font-mono">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/_([^_]+)_/g, "<em>$1</em>");

      return md.split("\n").map(raw => {
        if (raw.startsWith("# ")) {
          return `<h1 class="font-bold text-base mt-5 mb-2">${inlineFormat(esc(raw.slice(2)))}</h1>`;
        }
        if (raw.startsWith("## ")) {
          return `<h2 class="font-semibold text-sm mt-4 mb-1.5 text-slate-700 dark:text-zinc-300">${inlineFormat(esc(raw.slice(3)))}</h2>`;
        }
        if (raw.startsWith("### ")) {
          return `<h3 class="font-semibold text-sm mt-4 mb-1">${inlineFormat(esc(raw.slice(4)))}</h3>`;
        }
        if (raw.startsWith("- ") || raw.startsWith("* ")) {
          return `<p class="mb-0.5 leading-relaxed pl-3 before:content-['•'] before:mr-2 before:text-slate-400 dark:before:text-zinc-500">${inlineFormat(esc(raw.slice(2)))}</p>`;
        }
        if (raw === "---") return '<hr class="border-slate-200 dark:border-zinc-800 my-3">';
        if (!raw.trim()) return '<div class="h-1"></div>';

        // Expandable article block (single marker → preview + button in a wrapper)
        if (raw.startsWith("__EXPAND:") && raw.endsWith("__")) {
          const key = raw.slice(9, -2);
          const fullText = fullTextMap[key];
          if (!fullText) {
            return '<p class="text-xs text-slate-400 dark:text-zinc-500 italic">[realize nova busca para ver o texto completo]</p>';
          }
          const preview = esc(fullText.slice(0, PREVIEW));
          return `<div class="expandable-wrap"><p class="leading-relaxed mb-1.5">${preview}…</p>` +
            `<button class="expand-btn text-xs text-indigo-500 dark:text-indigo-400 hover:underline font-medium" data-key="${esc(key)}">Ver artigo completo</button></div>`;
        }

        // Section hierarchy breadcrumb
        if (raw.startsWith("__HIER:") && raw.endsWith("__")) {
          const text = esc(raw.slice(7, -2));
          return `<p class="text-xs text-slate-500 dark:text-zinc-400 mb-2 leading-snug">${text}</p>`;
        }

        return `<p class="mb-0.5 leading-relaxed">${inlineFormat(esc(raw))}</p>`;
      }).join("");
    }

    // ===========================================================
    // Vigência + Top-K UI
    // ===========================================================
    function updateVigenciaBtn() {
      if (vigenciaAtiva) {
        els.vigenciaBtn.className =
          "rounded-lg px-2.5 py-1 text-xs border font-medium transition-colors duration-150 " +
          "border-emerald-400 text-emerald-600 bg-emerald-50 dark:border-emerald-500 dark:text-emerald-400 dark:bg-emerald-950/40";
        els.vigenciaBtn.textContent = "Vigentes";
      } else {
        els.vigenciaBtn.className =
          "rounded-lg px-2.5 py-1 text-xs border font-medium transition-colors duration-150 " +
          "border-slate-200 dark:border-zinc-700 text-slate-400 dark:text-zinc-500 bg-transparent";
        els.vigenciaBtn.textContent = "Todas";
      }
    }

    els.vigenciaBtn.addEventListener("click", () => { vigenciaAtiva = !vigenciaAtiva; updateVigenciaBtn(); });
    els.kMinusBtn.addEventListener("click", () => { if (topK > 1)  { topK--; els.kValue.textContent = topK; } });
    els.kPlusBtn.addEventListener("click",  () => { if (topK < 20) { topK++; els.kValue.textContent = topK; } });

    // ===========================================================
    // Chat / API
    // ===========================================================
    async function sendMessage() {
      const chat = getActiveChat();
      const text = els.composer.value.trim();
      if (!chat || !text || isBusy) return;

      chat.messages.push({ role: "user", content: text });
      updateChatTitle(chat);
      els.composer.value = "";
      autosizeTextarea();
      updateCharCount();
      saveState();
      renderAll();
      scrollToBottom();

      // Thinking placeholder
      const assistantMsg = { role: "assistant", content: "__thinking__" };
      chat.messages.push(assistantMsg);
      renderMessages();
      scrollToBottom(false);

      isBusy = true;
      abortCtrl = new AbortController();
      els.stopBtn.classList.remove("hidden");
      updateSendBtn();

      try {
        // ── 1. Busca de artigos ─────────────────────────────────
        const filtros = vigenciaAtiva ? { vigencia: "ativa" } : {};
        const resp = await fetch(`${BACKEND_URL}/rag/buscar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, filtros, top_k: topK, usar_reranker: true, usar_mmr: true }),
          signal: abortCtrl.signal,
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(err.detail || `HTTP ${resp.status}`);
        }

        const data = await resp.json();
        assistantMsg.content = formatResultados(data);
        renderMessages();
        scrollToBottom(false);

        // ── 2. Resumo via SLM (streaming) ──────────────────────
        if (data.resultados && data.resultados.length > 0) {
          const summaryMsg = { role: "assistant", content: "__thinking_summary__" };
          chat.messages.push(summaryMsg);
          renderMessages();
          scrollToBottom(false);

          // Referência direta ao último bubble para updates parciais
          const summaryBubble = els.messageInner.lastChild?.firstChild;
          const INDIGO_CLASS =
            "w-full rounded-2xl px-4 py-3 text-sm leading-6 " +
            "bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-200 dark:border-indigo-800";
          const LABEL_HTML =
            `<p class="text-xs font-semibold text-indigo-500 dark:text-indigo-400 mb-2 uppercase tracking-wide">Análise dos artigos encontrados</p>`;
          const CURSOR_HTML =
            `<span class="inline-block w-0.5 h-3.5 bg-indigo-400 dark:bg-indigo-500 ml-0.5 align-middle animate-pulse"></span>`;

          let summaryText = "";
          try {
            const summaryResp = await fetch(`${BACKEND_URL}/rag/resumir`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query: text, chunks: data.resultados }),
              signal: abortCtrl.signal,
            });

            if (summaryResp.ok) {
              const reader = summaryResp.body.getReader();
              const decoder = new TextDecoder();
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                summaryText += decoder.decode(value, { stream: true });
                if (summaryBubble) {
                  summaryBubble.className = INDIGO_CLASS;
                  summaryBubble.innerHTML = LABEL_HTML + renderMd(summaryText.trim()) + CURSOR_HTML;
                  scrollToBottom(false);
                }
              }
            } else {
              summaryText = "_Resumo indisponível (erro no servidor)._";
            }
          } catch (summaryErr) {
            if (summaryErr.name === "AbortError") {
              summaryText = "_Análise cancelada._";
            } else {
              summaryText = `_Erro ao gerar resumo: ${summaryErr.message}_`;
            }
          }

          summaryMsg.content = "__ANALISE__" + (summaryText.trim() || "_O modelo não retornou resposta._");
          if (summaryBubble) {
            summaryBubble.className = INDIGO_CLASS;
            summaryBubble.innerHTML = LABEL_HTML + renderMd(summaryMsg.content.slice(11));
          }
        }

      } catch (err) {
        if (err.name === "AbortError") {
          assistantMsg.content = "_Busca cancelada._";
        } else {
          assistantMsg.content = `**Erro:** ${err.message}\n\nVerifique se o backend está rodando em \`${BACKEND_URL}\`.`;
        }
      } finally {
        isBusy = false;
        abortCtrl = null;
        els.stopBtn.classList.add("hidden");
        saveState();
        renderAll();
        scrollToBottom();
      }
    }

    function formatResultados(data) {
      const resultados = data.resultados || [];
      const total = data.total || resultados.length;

      if (resultados.length === 0) {
        return "### Nenhum resultado encontrado\n\n_Verifique se há legislação indexada ou refine a busca._";
      }

      const msgKey = ++msgCounter;
      const header =
        `_${total} resultado${total !== 1 ? "s" : ""} encontrado${total !== 1 ? "s" : ""}_ · ` +
        `vigência: \`${vigenciaAtiva ? "somente vigentes" : "todas"}\` · top-k: \`${topK}\`\n\n---\n`;

      const blocos = resultados.map((r, i) => {
        const fonte  = r.fonte    || "Fonte desconhecida";
        const artigo = r.artigo   ? ` — ${r.artigo}` : "";
        const area   = r.area     ? `\`${r.area}\`` : "";
        const vig    = r.vigencia ? `\`${r.vigencia}\`` : "";
        const pct    = typeof r.score === "number"
          ? `relevância: \`${(r.score * 100).toFixed(1)}%\`` : "";
        const badges = [area, vig, pct].filter(Boolean).join(" &nbsp; ");

        // Hierarchy breadcrumb (titulo › capitulo › secao)
        const hier = [r.titulo, r.capitulo, r.secao].filter(Boolean);
        const hierLine = hier.length ? `__HIER:${hier.join(" › ")}__\n` : "";

        const texto = r.texto || "";
        let textoMd;
        if (texto.length > PREVIEW) {
          const key = `${msgKey}-${i}`;
          fullTextMap[key] = texto;
          textoMd = `__EXPAND:${key}__`;   // single marker: renderMd renders preview+button
        } else {
          textoMd = texto;
        }

        return `### ${i + 1}. ${fonte}${artigo}\n${badges}\n${hierLine}\n${textoMd}\n\n---`;
      });

      return header + blocos.join("\n");
    }

    function stopSearch() {
      if (abortCtrl) abortCtrl.abort();
    }

    // ===========================================================
    // Chat helpers
    // ===========================================================
    function updateChatTitle(chat) {
      const first = chat.messages.find(m => m.role === "user");
      if (!first) return;
      const t = first.content.trim().replace(/\s+/g, " ");
      chat.title = t.length > 32 ? t.slice(0, 32) + "…" : (t || "Nova consulta");
    }

    function newChat() {
      const c = createChat();
      state.chats.unshift(c);
      state.activeChatId = c.id;
      saveState();
      renderAll();
      els.composer.focus();
      closeSidebar();
    }

    function deleteChat(id) {
      const idx = state.chats.findIndex(c => c.id === id);
      if (idx === -1) return;
      state.chats.splice(idx, 1);
      if (state.chats.length === 0) {
        const c = createChat();
        state.chats.unshift(c);
        state.activeChatId = c.id;
      } else if (state.activeChatId === id) {
        state.activeChatId = state.chats[0].id;
      }
      saveState();
      renderAll();
    }

    // ===========================================================
    // Transcription drawer
    // ===========================================================
    function openDrawer()  { els.transDrawer.classList.remove("translate-x-full"); }
    function closeDrawer() { els.transDrawer.classList.add("translate-x-full"); }

    els.openTransBtn?.addEventListener("click", openDrawer);
    els.openTransBtnMobile?.addEventListener("click", openDrawer);
    els.closeDrawerBtn.addEventListener("click", closeDrawer);

    let originalMarkdown = "";

    els.transcreverBtn.addEventListener("click", async () => {
      const file = els.audioFile.files[0];
      if (!file) {
        els.transStatus.textContent = "Selecione um arquivo de áudio primeiro.";
        els.transStatus.classList.remove("hidden");
        return;
      }

      els.transcreverBtn.disabled = true;
      els.transResult.classList.add("hidden");
      els.transCorrections.classList.add("hidden");
      els.transStatus.textContent = "Transcrevendo... pode levar alguns minutos.";
      els.transStatus.classList.remove("hidden");

      const form = new FormData();
      form.append("audio", file);
      form.append("numero_processo",     $("#metaProcesso").value);
      form.append("data_audiencia",      $("#metaData").value);
      form.append("tipo_audiencia",      $("#metaTipo").value || "Instrução e Julgamento");
      form.append("vara",                $("#metaVara").value);
      form.append("cidade_uf",           $("#metaCidade").value);
      form.append("min_speakers",        $("#metaMinSpk").value);
      form.append("max_speakers",        $("#metaMaxSpk").value);
      form.append("identificar_por_llm", "true");
      form.append("juiz",                $("#metaJuiz").value);
      form.append("advogado_autor",      $("#metaAdvAutor").value);
      form.append("advogado_reu",        $("#metaAdvReu").value);
      form.append("testemunha_1",        $("#metaTestemunha1").value);
      form.append("testemunha_2",        $("#metaTestemunha2").value);
      form.append("perito",              $("#metaPerito").value);

      try {
        const resp = await fetch(`${BACKEND_URL}/transcricao/transcrever`, { method: "POST", body: form });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ detail: resp.statusText }));
          throw new Error(err.detail || `HTTP ${resp.status}`);
        }
        const data = await resp.json();
        const num  = data.num_participantes || 0;
        const dur  = data.duracao_total || 0;
        const mins = Math.floor(dur / 60);
        const segs = Math.floor(dur % 60);
        els.transStatus.textContent = `Concluído · ${num} falante(s) · ${mins}min ${segs}s`;
        originalMarkdown = data.markdown || "(sem conteúdo)";
        els.transResult.innerHTML = renderMd(originalMarkdown);
        els.transResult.classList.remove("hidden");

        // Camada 4: preenche tabela de revisão de participantes
        const mapeamento = data.mapeamento_speakers || {};
        els.correctionsList.innerHTML = "";
        if (Object.keys(mapeamento).length > 0) {
          Object.entries(mapeamento).forEach(([speakerId, nomeFormatado]) => {
            const row = document.createElement("div");
            row.className = "flex items-center gap-2";
            row.innerHTML =
              `<span class="shrink-0 text-xs font-mono text-slate-400 dark:text-zinc-500 w-24">${escHtml(speakerId)}</span>` +
              `<input type="text" value="${escHtml(nomeFormatado)}"
                data-original="${escHtml(nomeFormatado)}"
                class="flex-1 text-xs rounded-lg border border-slate-200 dark:border-zinc-700 bg-transparent px-2 py-1.5
                       focus:outline-none focus:border-slate-400 dark:focus:border-zinc-500">`;
            els.correctionsList.appendChild(row);
          });
          els.transCorrections.classList.remove("hidden");
        }
      } catch (err) {
        els.transStatus.textContent = `Erro: ${err.message}`;
      } finally {
        els.transcreverBtn.disabled = false;
      }
    });

    els.applyCorrectionsBtn.addEventListener("click", () => {
      let corrigido = originalMarkdown;
      els.correctionsList.querySelectorAll("input[data-original]").forEach(input => {
        const original = input.dataset.original;
        const novo = input.value.trim();
        if (original && novo && original !== novo) {
          corrigido = corrigido.split(original).join(novo);
        }
      });
      els.transResult.innerHTML = renderMd(corrigido);
    });

    // ===========================================================
    // Utilities
    // ===========================================================
    function escHtml(s) {
      return (s || "").replace(/[&<>"']/g, m =>
        ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]);
    }

    function autosizeTextarea() {
      const ta = els.composer;
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 176) + "px";
    }

    function setComposerText(t) {
      els.composer.value = t || "";
      autosizeTextarea();
      updateCharCount();
      updateSendBtn();
      els.composer.focus();
      els.composer.setSelectionRange(t.length, t.length);
    }

    // ===========================================================
    // Event wiring
    // ===========================================================
    els.sendBtn.addEventListener("click", sendMessage);
    els.composer.addEventListener("input", () => { autosizeTextarea(); updateSendBtn(); updateCharCount(); });
    els.composer.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    els.newChatBtn?.addEventListener("click", newChat);
    els.newChatBtnMobile?.addEventListener("click", newChat);
    els.toggleThemeBtn?.addEventListener("click", toggleTheme);
    els.toggleThemeBtnMobile?.addEventListener("click", toggleTheme);
    els.clearBtn?.addEventListener("click", () => setComposerText(""));
    els.stopBtn?.addEventListener("click", stopSearch);
    document.querySelectorAll(".suggestBtn").forEach(btn =>
      btn.addEventListener("click", () => setComposerText(btn.dataset.text || "")));

    // Expand article — replace the whole .expandable-wrap (not just the button)
    els.messageInner.addEventListener("click", (e) => {
      const btn = e.target.closest(".expand-btn");
      if (!btn) return;
      const key = btn.dataset.key;
      const fullText = fullTextMap[key];
      if (!fullText) return;
      const wrap = btn.closest(".expandable-wrap");
      const p = document.createElement("p");
      p.className = "leading-relaxed";
      p.textContent = fullText;
      (wrap || btn).replaceWith(p);
    });

    // Init
    autosizeTextarea();
    updateSendBtn();
    updateCharCount();
    updateComposerLayout();
    els.composer.focus();
  </script>
  </body>
</html>
